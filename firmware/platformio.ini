; ============================================================================
; Monitoreo ESP32
; ============================================================================
;   pio run              compilar
;   pio run -t upload    cargar al equipo
;   pio device monitor   consola serie
;   make test            pruebas de lógica en el host (no requiere hardware)
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Los drivers del HX711 y del MAX6675 son propios: las librerías habituales
; bloquean esperando conversión, que es justamente el problema que se corrige.
; Ver src/sensores/bascula.h y src/sensores/termopares.h.
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1

build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

; Partición dual, necesaria para el OTA con rollback de la Fase 3. Definirla
; ahora evita tener que reparticionar (y borrar la NVS con la calibración)
; cuando llegue esa fase.
board_build.partitions = default.csv
