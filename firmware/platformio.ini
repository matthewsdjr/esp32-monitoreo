; ============================================================================
; Monitoreo ESP32
; ============================================================================
;   pio run              compilar
;   pio run -t upload    cargar al equipo
;   pio device monitor   consola serie
;   make test            pruebas de lógica en el host (no requiere hardware)
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Los drivers del HX711 y del MAX6675 son propios: las librerías habituales
; bloquean esperando conversión, que es justamente el problema que se corrige.
; Ver src/sensores/bascula.h y src/sensores/termopares.h.
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

; Partición dual para OTA con reversión.
;
; min_spiffs y no default: con default.csv cada ranura de aplicación son 1.25 MB
; y el firmware ya ocupaba el 84 %. Una actualización OTA debe caber ENTERA en la
; ranura libre, así que quedarse sin margen significa no poder actualizar el
; equipo de forma remota — justo cuando más falta hace.
;
; Con min_spiffs cada ranura sube a ~1.9 MB (uso ~60 %) a cambio de reducir el
; sistema de archivos a ~190 KB. Ese espacio da ~6 800 muestras de respaldo, unas
; 9 h de caída de red, muy por encima de los 30 min del criterio de aceptación.
board_build.partitions = min_spiffs.csv
