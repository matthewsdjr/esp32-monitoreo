name: Escaneo de secretos

# Este repositorio es PÚBLICO. Un secreto que entre a un commit sigue siendo
# público aunque se borre después. Este workflow revisa TODO el historial en
# cada push, y bloquea el merge si encuentra algo.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC, por si se filtró algo vía otro camino

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: es el punto del ejercicio

      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
